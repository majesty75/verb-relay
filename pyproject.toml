[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trace32-mcp"
version = "0.3.0"
description = "Model Context Protocol server for Lauterbach TRACE32 PowerView / PowerDebug"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Trace32-MCP contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.7.0",
    "numpy>=1.26.0",
    "sqlite-vec>=0.1.6",
    # Embedding runtime: ONNX model + tokenizer, NO torch. onnxruntime CPU is a
    # ~10 MB wheel and tokenizers is a small Rust wheel — both trivial to vendor
    # for air-gapped installs. The vendored model lives in trace32_mcp/model/.
    "onnxruntime>=1.17.0",
    "tokenizers>=0.15.0",
    "zstandard>=0.22.0",
    # Lauterbach's official native Python RCL implementation (PYRCL).
    # Replaces the legacy ctypes + libt32api shared-library plumbing.
    "lauterbach-trace32-rcl>=1.1.5",
]

[project.optional-dependencies]
# The sentence-transformers / torch path. Only needed as a FALLBACK when no
# vendored ONNX model is present, or to (re)build the ONNX model / DB. End
# users on the shipped wheel do NOT need this — that's the whole point.
torch = [
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",
]
# Adds the ingest pipeline (PDF parsing + chunker + optional OCR), the ONNX
# export deps, and the `t32-rag` CLI. End users running the MCP server do NOT
# need these.
build = [
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",
    "onnx>=1.16.0",
    "onnxscript>=0.1.0",
    "pymupdf>=1.24.0",
    "tqdm>=4.66.0",
    "click>=8.1.0",
    "pytesseract>=0.3.10",  # needs the `tesseract` binary on PATH
    "pillow>=10.0.0",
]
dev = ["pytest>=8.0", "ruff>=0.6.0"]

[project.scripts]
trace32-mcp          = "trace32_mcp.server:main"
trace32-mcp-prefetch = "trace32_mcp.manuals.prefetch:main"
trace32-mcp-selftest = "trace32_mcp.manuals.diag:main"
t32-rag              = "trace32_mcp.manuals_build.cli:main"

[project.urls]
Homepage = "https://github.com/REPLACE_ME/Trace32-MCP"
Issues   = "https://github.com/REPLACE_ME/Trace32-MCP/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trace32_mcp = ["py.typed", "db/*.db", "model/model.onnx", "model/tokenizer.json", "model/meta.json"]
